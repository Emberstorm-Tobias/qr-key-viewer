<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Key</title>
<meta name="color-scheme" content="dark light">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#000;
    color:#fff;text-align:center;padding:20px;
  }
  /* Painted on a fixed layer because background-attachment:fixed breaks on iOS Safari. */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;
    background:#000 url("background.jpeg") center/cover no-repeat; /* <-- change image */
  }
  .overlay{
    background:rgba(0,0,0,0.6);padding:30px;border-radius:16px;
    max-width:600px;width:100%;
  }
  h1{font-size:20px;margin-bottom:16px}
  .key{
    font:700 32px/1.3 ui-monospace,monospace;
    word-break:break-word;
    background:#111;border:1px dashed #555;padding:16px;border-radius:12px;
    margin-bottom:16px;
  }
  button,.btn{
    display:inline-block;background:#E97451;color:#2B0F06;border:none;
    padding:12px 18px;border-radius:10px;cursor:pointer;text-decoration:none;
    font-weight:700;font-size:1rem;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  button:active,.btn:active{transform:scale(0.97)}
  button.secondary{background:#333;color:#fff;font-weight:600}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .hidden{display:none !important}
  .ok{display:none;margin-top:8px;color:#9bd59b;font-size:14px}
  footer{margin-top:20px;font-size:14px;color:#ddd}
  a{color:#E97451}
.logo-container {
  display: flex;
  justify-content: center;
  margin-bottom: 12px;
}

.logo {
  max-width: 100%;   /* never exceed container width */
  height: auto;
  width: auto;
  max-height: 120px; /* optional: cap vertical size so it doesn’t dominate */
}
</style>
</head>
<body>
  <div class="overlay">
    <div class="logo-container">
     <img src="logo.PNG" alt="Game Logo" class="logo">
    </div>
    <h1>Your Steam Key</h1>
    <div id="key" class="key">—</div>
    <div class="btn-row">
      <a id="redeem" class="btn hidden" target="_blank" rel="noopener">Redeem on Steam</a>
      <button id="copy" class="secondary">Copy Key</button>
    </div>
    <div id="ok" class="ok">Copied!</div>
    <footer>
      contact me at: <a id="contact" href="mailto:tobias.hermann@emberstorm.de">tobias.hermann@emberstorm.de</a>
    </footer>
  </div>

<script>
(function(){
  function getParams(){
    const hash = (location.hash||"").replace(/^#/,"");
    if(hash){
      if(hash.indexOf("=") >= 0){
        const p = new URLSearchParams(hash);
        if(p.has("k")) return {k: p.get("k") || "", c: p.get("c") || ""};
      }
      return {k: decodeURIComponent(hash), c: ""};
    }
    const q = new URLSearchParams(location.search);
    return {k: q.get("k") || "", c: q.get("c") || ""};
  }
  function setKeyText(v){
    document.getElementById('key').textContent = v || "—";
    document.title = v ? `Key: ${v}` : "Show Key";
  }
  async function copyText(txt){
    try{
      await navigator.clipboard.writeText(txt);
      const ok = document.getElementById('ok');
      ok.style.display='block';
      setTimeout(()=>ok.style.display='none',1200);
    }catch(e){console.warn(e);}
  }
  const p = getParams();
  setKeyText(p.k);
  if(p.k){
    const r = document.getElementById('redeem');
    r.href = 'https://store.steampowered.com/account/registerkey?key=' + encodeURIComponent(p.k);
    r.classList.remove('hidden');
  }
  if(p.c){
    const a = document.getElementById('contact');
    a.textContent = p.c;
    a.href = 'mailto:' + p.c;
  }
  document.getElementById('copy').addEventListener('click', ()=> p.k && copyText(p.k));
})();
</script>
</body>
</html>
